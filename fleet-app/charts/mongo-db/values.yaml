# Default values for mongo-db.

# Number of MongoDB replicas
replicaCount: 1

# MongoDB container image
image:
  repository: mongo
  tag: "7"
  pullPolicy: IfNotPresent

# Optional: image pull secrets if you use private registries
imagePullSecrets: []

# Override chart names
nameOverride: ""
fullnameOverride: ""

# Service account config (MongoDB doesn’t need special service accounts usually)
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod annotations and labels
podAnnotations: {}
podLabels: {}

# Security context — you can enable later if needed
podSecurityContext: {}
securityContext: {}

# MongoDB root user credentials
mongodb:
  rootUser: root
  rootPassword: rootpassword
  database: admin

# MongoDB service configuration
service:
  type: ClusterIP
  port: 27017
  targetPort: 27017

# Optional NodePort access (uncomment if needed)
# service:
#   type: NodePort
#   port: 27017
#   targetPort: 27017
#   nodePort: 32000

# Liveness and Readiness Probes for MongoDB
livenessProbe:
  exec:
    command:
      - mongosh
      - --eval
      - db.adminCommand('ping')
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  exec:
    command:
      - mongosh
      - --eval
      - db.adminCommand('ping')
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Resources (can tune based on cluster)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Volume configurations
storage:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClassName: ""  # Leave blank for Minikube hostPath usage

# Custom volume mounts if needed
volumeMounts:
  - name: mongodb-storage
    mountPath: /data/db

# Node scheduling (optional)
nodeSelector: {}
tolerations: []
affinity: {}

# Autoscaling (MongoDB rarely autoscaled this way)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
