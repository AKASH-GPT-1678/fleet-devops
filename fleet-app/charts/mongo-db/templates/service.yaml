apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongo-db.fullname" . }}
  namespace: fleet-app
  labels:
    {{- include "mongo-db.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{.Values.service.targetPort}}
      protocol: TCP
      name: http
  selector:
    {{- include "mongo-db.selectorLabels" . | nindent 4 }}
