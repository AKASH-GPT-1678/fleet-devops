# Default values for redis.
# Declare variables to be passed into your templates.

replicaCount: 1

# -------------------------------------------------
# Redis container image settings
# -------------------------------------------------
image:
  repository: redis
  tag: "7"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -------------------------------------------------
# Service Account
# -------------------------------------------------
serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

# -------------------------------------------------
# Pod metadata
# -------------------------------------------------
podAnnotations: {}
podLabels: {}

# -------------------------------------------------
# Security settings
# -------------------------------------------------
podSecurityContext: {}
securityContext: {}

# -------------------------------------------------
# Redis service setup
# -------------------------------------------------
service:
  type: ClusterIP
  port: 6379

# -------------------------------------------------
# Ingress (Redis is not HTTP-based, so disabled)
# -------------------------------------------------
ingress:
  enabled: false

# -------------------------------------------------
# Resource requests/limits
# -------------------------------------------------
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# -------------------------------------------------
# Health checks (ping command ensures Redis is alive)
# -------------------------------------------------
livenessProbe:
  exec:
    command: ["redis-cli", "ping"]
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  exec:
    command: ["redis-cli", "ping"]
  initialDelaySeconds: 5
  periodSeconds: 10

# -------------------------------------------------
# Autoscaling (off for Redis)
# -------------------------------------------------
autoscaling:
  enabled: false

# -------------------------------------------------
# Persistence (data volume)
# -------------------------------------------------
persistence:
  enabled: true
  storage: 1Gi
  path: /data
  claimName: redis-pvc  # 👈 Important: matches PVC name

# -------------------------------------------------
# Node scheduling
# -------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# -------------------------------------------------
# Volumes (empty — handled in Deployment)
# -------------------------------------------------
volumes: []
volumeMounts: []
